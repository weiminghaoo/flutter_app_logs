name: flutter_app_logs
description: >-
  An in-app debug panel for Flutter — inspect network requests, opt-in console
  logs, and captured Flutter errors with a draggable panel, similar to vConsole.
version: 0.2.2
homepage: https://github.com/wildcatDownstairs/flutter_app_logs
repository: https://github.com/wildcatDownstairs/flutter_app_logs
issue_tracker: https://github.com/wildcatDownstairs/flutter_app_logs/issues
topics:
  - logging
  - network
  - debugging
  - devtools
  - monitoring

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.9.2 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
